<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@600&display=swap" rel="stylesheet">

<style>
body{
  height:100vh;
  margin:0;
  background:linear-gradient(135deg,#ffe6eb,#fff);
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Quicksand',sans-serif;
  overflow:hidden;
}

.heart{
  position:absolute;
  bottom:-40px;
  animation:float 8s linear infinite;
  opacity:.7;
}
@keyframes float{
  0%{transform:translateY(0) scale(.7);opacity:0}
  20%{opacity:1}
  100%{transform:translateY(-120vh) scale(1.2);opacity:0}
}

.card{
  background:white;
  width:90%;
  max-width:340px;
  padding:20px;
  border-radius:22px;
  text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,.15);
}

.photo-box{
  width:100%;
  aspect-ratio:1/1;        /* 👈 forces square */
  border-radius:18px;
  overflow:hidden;
  margin-bottom:15px;
}

.photo-box img{
  width:100%;
  height:100%;
  object-fit:cover;       /* 👈 clean crop, no distortion */
}


h1{
  font-family:Pacifico;
  color:#ff4d6d;
  margin-bottom:10px;
}
</style>
</head>
<body>

<!-- Floating hearts -->
<script>
for(let i=0;i<15;i++){
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="💖";
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=14+Math.random()*18+"px";
  h.style.animationDuration=6+Math.random()*4+"s";
  document.body.appendChild(h);
}
</script>

<!-- MUSIC (autoplay works after user interaction on first page) -->
<audio autoplay loop>
  <source src="music/bgm.mp3">
</audio>

<div class="card">
  <div class="photo-box">
  <img src="images/img5.jpg" alt="Me">
</div>


  <h1>No more where the hell is my HUSBAND? 💖</h1>

  <p>
    YES, this weirdo here, this will be your husband, isse hi kaam chalana padega apko 😭😭😭😭
  </p>
</div>

</body>
</html>
